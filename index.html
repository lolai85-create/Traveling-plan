<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行計劃 Dashboard MVP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        /* 確保地圖有固定高度 */
        #map { height: 100%; min-height: 400px; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🧳 旅行計劃 Dashboard</h1>
        <button id="installBtn" class="hidden bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-semibold shadow">
            安裝到手機
        </button>
    </header>

    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-4 h-[calc(100vh-80px)]">
        
        <section class="bg-white p-6 rounded-2xl shadow-sm overflow-y-auto flex flex-col justify-between">
            <div>
                <div class="mb-4">
                    <h2 class="text-2xl font-black text-gray-800" id="tripTitle">加載中...</h2>
                    <p class="text-sm text-gray-500">目的：<span id="tripPurpose"></span> | 類型：<span id="tripType"></span></p>
                </div>

                <div class="flex gap-2 mb-6" id="dayTabs">
                    </div>

                <div class="relative border-l-2 border-blue-200 ml-4 space-y-6" id="timeline">
                    </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-2">➕ 快速新增景點 (MVP 模擬)</h3>
                <div class="flex gap-2">
                    <input type="text" id="newPlaceName" placeholder="景點名稱" class="flex-1 px-3 py-2 border rounded-xl text-sm">
                    <button onclick="addPlace()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold">新增</button>
                </div>
            </div>
        </section>

        <section class="bg-gray-200 rounded-2xl shadow-sm overflow-hidden relative">
            <div id="map" class="flex items-center justify-center text-gray-500 flex-col p-4 bg-slate-800 text-white">
                <span class="text-4xl mb-2">🗺️</span>
                <p class="font-bold">Google Maps 區塊</p>
                <p class="text-xs text-slate-400 mt-2 text-center">請在 HTML 原始碼中填入你的 API Key 即可啟用真實地圖</p>
                <div id="mapCoordinates" class="mt-4 text-xs font-mono text-emerald-400 bg-black/40 p-2 rounded">
                    正在顯示：Day 1 景點標記中...
                </div>
            </div>
        </section>
    </main>

    <script>
        // 1. 模擬的行程資料庫 (JSON 結構)
        let tripData = {
            title: "東京 5 天 4 夜吃貨文青之旅",
            purpose: "美食放鬆",
            type: "好友死黨",
            currentDay: 1,
            days: {
                1: [
                    { name: "成田國際機場", time: "13:00", lat: 35.7719, lng: 140.3928 },
                    { name: "東京晴空塔 (SKYTREE)", time: "16:30", lat: 35.7100, lng: 139.8107 },
                    { name: "淺草寺 雷門", time: "19:00", lat: 35.7147, lng: 139.7966 }
                ],
                2: [
                    { name: "築地場外市場", time: "09:00", lat: 35.6655, lng: 139.7702 },
                    { name: "秋葉原電器街", time: "13:00", lat: 35.6997, lng: 139.7714 }
                ],
                3: []
            }
        };

        // 2. 渲染 UI 介面
        function renderDashboard() {
            document.getElementById('tripTitle').innerText = tripData.title;
            document.getElementById('tripPurpose').innerText = tripData.purpose;
            document.getElementById('tripType').innerText = tripData.type;

            // 渲染天數頁籤
            const dayTabs = document.getElementById('dayTabs');
            dayTabs.innerHTML = '';
            Object.keys(tripData.days).forEach(day => {
                const isActive = tripData.currentDay == day;
                dayTabs.innerHTML += `
                    <button onclick="switchDay(${day})" class="px-4 py-2 rounded-xl text-sm font-bold transition-all ${isActive ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}">
                        Day ${day}
                    </button>
                `;
            });

            // 渲染當天時間軸行程
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            const currentPlaces = tripData.days[tripData.currentDay];

            if (currentPlaces.length === 0) {
                timeline.innerHTML = `<p class="text-gray-400 text-sm pl-4 italic">今天還沒有安排行程，請在下方新增！</p>`;
                return;
            }

            currentPlaces.forEach((place, index) => {
                timeline.innerHTML += `
                    <div class="relative pl-6 group">
                        <div class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-blue-600 border-2 border-white shadow-sm"></div>
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-mono font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${place.time}</span>
                                <h4 class="font-bold text-gray-800 mt-1">${index + 1}. ${place.name}</h4>
                            </div>
                            <span class="text-xs text-gray-400 font-mono">${place.lat.toFixed(2)}, ${place.lng.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });

            // 模擬地圖座標連動更新
            document.getElementById('mapCoordinates').innerHTML = `
                <strong>當前地圖連動 (Day ${tripData.currentDay}):</strong><br>
                ${currentPlaces.map(p => `📍 ${p.name} (${p.lat.toFixed(2)}, ${p.lng.toFixed(2)})`).join('<br>') || '暫無景點定位'}
            `;
        }

        // 切換天數
        function switchDay(day) {
            tripData.currentDay = day;
            renderDashboard();
        }

        // 新增景點模擬 (給定隨機東京座標)
        function addPlace() {
            const nameInput = document.getElementById('newPlaceName');
            if (!nameInput.value.trim()) return;

            // 隨機生成一個接近東京的座標
            const randomLat = 35.65 + (Math.random() * 0.08);
            const randomLng = 139.70 + (Math.random() * 0.08);
            
            // 簡單推算時間
            const currentPlaces = tripData.days[tripData.currentDay];
            const nextHour = currentPlaces.length > 0 ? parseInt(currentPlaces[currentPlaces.length - 1].time) + 2 : 10;
            const timeStr = `${nextHour}:00`;

            tripData.days[tripData.currentDay].push({
                name: nameInput.value,
                time: timeStr,
                lat: randomLat,
                lng: randomLng
            });

            nameInput.value = '';
            renderDashboard();
        }

        // 初始化渲染
        renderDashboard();

        // ==========================================
        // 3. PWA 功能與 Service Worker 註冊
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker 註冊成功！', reg.scope))
                    .catch(err => console.log('Service Worker 註冊失敗：', err));
            });
        }

        // 處理「安裝到手機主畫面」按鈕提示
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // 顯示安裝按鈕
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`使用者安裝選擇: ${outcome}`);
            deferredPrompt = null;
            installBtn.classList.add('hidden');
        });
    </script>

    </body>
</html>
